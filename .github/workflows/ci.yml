name: CI

on:
  push:
    branches: [master]
  pull_request:
  # so that the release workflow can gate the publish on the same checks
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a superseded pull request run is worth cancelling, a release run is not
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Origins serving the dictionary seed, tried in order until one answers with
  # an intact dump. Override without touching this file by setting a SEED_HOSTS
  # repository variable to a whitespace separated list.
  SEED_HOSTS: ${{ vars.SEED_HOSTS || 'https://gbp.qxuken.dev https://genshinbuild.app' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # ui/dist is a build output, but ui/embed.go go:embeds it, so the package
      # does not compile unless the directory exists. The backend tests never
      # read the assets, so an empty one is enough here.
      - name: Stub the embedded frontend
        run: mkdir -p ui/dist && touch ui/dist/index.html

      # migrations/ is left out, those files are generated by pocketbase's
      # migratecmd and it does not emit gofmt clean output
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internals ui)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./cmd/gbp

      - run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run check

      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the dictionary seed
        run: scripts/fetch_seed.sh

      # only the final COPY-only stage is per target platform, but binfmt is
      # cheap insurance against that changing
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # same platforms as the release, so a tag push cannot be the first time a
      # multi platform build is attempted
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
