name: Release

on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: qxuken/gbp
  # see the note in ci.yml
  SEED_HOSTS: ${{ vars.SEED_HOSTS || 'https://gbp.qxuken.dev https://genshinbuild.app' }}

jobs:
  # nothing is published unless the tagged commit passes the same checks a pull
  # request would
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the first host is where new seeds are published, the fallbacks are the
      # deployments this release is about to replace, so falling back would
      # quietly ship the seed that is already live
      - name: Fetch the dictionary seed
        run: scripts/fetch_seed.sh
        env:
          SEED_STRICT: '1'

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            # bare sha, matching what publish.nu has been pushing
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=Genshin Build Planner

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
