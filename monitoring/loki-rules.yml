# Loki alerting rules for gbp, in the same Prometheus rule format. Load them
# into the Loki ruler or import them in Grafana: Alerting -> Alert rules ->
# Import to Grafana-managed rules, with the Loki data source.
#
# Streams are {job="gbp", instance="<domain>", level, type}: Alloy turns the
# app's JSON log lines into labels (type="request" for access logs).
groups:
  - name: gbp-logs
    rules:
      - alert: GbpErrorLogged
        # app errors only: failed requests are ERROR too, and the metrics cover them
        expr: sum by (instance) (count_over_time({job="gbp", level="ERROR", type!="request"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "gbp logged {{ $value }} errors in 10 minutes"
          description: >-
            The app logged an ERROR that is not a request log, e.g. a failed
            seed preload or an ACME renewal problem. Query
            {job="gbp", level="ERROR", type!="request"} for the messages.

      - alert: GbpLogsMissing
        # the probe alone produces a request log every minute
        expr: absent_over_time({job="gbp"}[15m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: No gbp logs for 15 minutes
          description: >-
            Logs stopped arriving while the probe should have produced some.
            Check the alloy container on the host and the Loki push endpoint.
